# .github/workflows/crawler.yml
name: Crawler Scheduled Task

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 授予写权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # 拉取所有历史，以便 pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pyyaml

      - name: Run crawler
        run: python crawler.py

      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 拉取远程最新变更（rebase 避免合并提交）
          git pull --rebase origin master || echo "No remote changes or rebase failed"
          # 添加文件
          git add crawclash.yaml crawsub.txt || echo "No files to add"
          # 如果有变更则提交
          git diff --staged --quiet || git commit -m "Update node configs $(date +'%Y-%m-%d %H:%M')"
          # 推送
          git push origin master
