# .github/workflows/crawler.yml
name: Crawler Scheduled Task

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 授予写权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pyyaml

      - name: Run crawler
        run: python crawler.py

      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crawclash.yaml crawsub.txt || echo "No files to add"
          git diff --staged --quiet || git commit -m "Update node configs $(date +'%Y-%m-%d %H:%M')"
          git push
