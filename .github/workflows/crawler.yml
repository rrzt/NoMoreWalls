# .github/workflows/crawler.yml
# GitHub Actions 定时任务：每 3 小时运行一次节点爬虫

name: Crawler Scheduled Task

on:
  # 定时触发：每 3 小时执行一次（分针为 0，即整点）
  schedule:
    - cron: '0 */3 * * *'
  # 支持手动触发（方便测试）
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 可根据需要调整版本

      # 3. 安装 Python 依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml

      # 4. 运行爬虫程序
      - name: Run crawler
        run: python crawler.py

      # 5. 上传生成的配置文件作为 Artifact（便于查看和下载）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-configs
          path: |
            crawclash.yaml
            crawsub.txt
          if-no-files-found: warn
